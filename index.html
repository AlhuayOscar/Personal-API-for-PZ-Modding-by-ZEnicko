    <style>
        :root {
            --bg-color: #1e1e1e;

            --sidebar-bg: #252526;
            --border-color: #3c3c3c;
            --input-bg: #3c3c3c;
            --input-text: #fff;
            --box-bg: #2d2d30;
            --header-text: #fff;
            --accent: #569cd6;
            --type-color: #4ec9b0;
            --method-color: #dcdcaa;
            --field-color: #9cdcfe;
        }
        .light-mode {
            --bg-color: #ffffff;
            --text-color: #333333;
            --sidebar-bg: #f3f3f3;
            --border-color: #cccccc;
            --input-bg: #ffffff;
            --input-text: #333333;
            --box-bg: #f9f9f9;
            --header-text: #222222;
            --accent: #0056b3;
            --type-color: #0d8a70;
            --method-color: #795e26;
            --field-color: #001080;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; height: 100vh; margin: 0; background: var(--bg-color); color: var(--text-color); overflow: hidden; }
        #sidebar { width: 350px; background: var(--sidebar-bg); padding: 10px; overflow-y: auto; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        #content { flex: 1; padding: 20px; overflow-y: auto; position: relative; }
        .top-bar { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; }
        .btn { background: var(--box-bg); color: var(--text-color); border: 1px solid var(--border-color); padding: 8px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; transition: all 0.2s; }
        .btn:hover { filter: brightness(1.2); }
        input[type="text"] { width: 100%; padding: 8px; margin-bottom: 15px; box-sizing: border-box; background: var(--input-bg); border: 1px solid var(--border-color); color: var(--input-text); }
        .package { cursor: pointer; font-weight: bold; margin-top: 10px; color: var(--accent); }
        .class-item { margin-left: 15px; cursor: pointer; color: var(--type-color); font-size: 0.9em; margin-top: 5px; }
        .class-item:hover { text-decoration: underline; }
        h1 { color: var(--header-text); }
        h2 { color: var(--type-color); border-bottom: 1px solid var(--border-color); padding-bottom: 5px; }
        .header-info { margin-bottom: 20px; font-size: 1.1em; color: var(--method-color); }
        .header-info a { color: var(--accent); text-decoration: none; }
        .header-info a:hover { text-decoration: underline; }
        
        .section-title { color: var(--method-color); margin-top: 20px; border-bottom: 1px dashed var(--border-color); padding-bottom: 5px; }
        .method, .field { margin-bottom: 10px; background: var(--box-bg); padding: 10px; border-radius: 4px; font-family: Consolas, 'Courier New', monospace; font-size: 0.95em; }
        .type-link { color: var(--type-color); text-decoration: none; cursor: pointer; }
        .type-link:hover { text-decoration: underline; }
        .method-name { color: var(--method-color); font-weight: bold; }
        .field-name { color: var(--field-color); font-weight: bold; }
        .keyword { color: var(--accent); }
        .pkg-link { color: var(--accent); cursor: pointer; text-decoration: none; }
        .pkg-link:hover { text-decoration: underline; }
        .example-box { margin-top: 15px; margin-bottom: 20px; background: var(--bg-color); padding: 15px; border: 1px solid var(--border-color); border-left: 4px solid var(--accent); border-radius: 4px; font-family: Consolas, 'Courier New', monospace; font-size: 0.9em; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>

        function setSearch(val) {
            searchInput.value = val;

        function renderSidebar(filter = '') {
            packageList.innerHTML = '';
            filter = filter.toLowerCase();
            for (const pkg in apiData) {
                let pkgVisible = pkg.toLowerCase().includes(filter);
                const classItems = apiData[pkg].filter(c => c.class.toLowerCase().includes(filter) || pkgVisible);
                
                if (classItems.length > 0) {
                    const pkgDiv = document.createElement('div');
                    pkgDiv.className = 'package';
                    pkgDiv.textContent = pkg;
                    packageList.appendChild(pkgDiv);
                    
                    classItems.sort((a,b) => a.class.localeCompare(b.class)).forEach(c => {
                        const cDiv = document.createElement('div');
                        cDiv.className = 'class-item';
                        cDiv.textContent = c.class;
                        cDiv.onclick = () => openClass(pkg, c.class);
                        packageList.appendChild(cDiv);
                    });
                }
            }
        }

        function linkifyType(typeStr) {
            return typeStr.replace(/\b([A-Z][a-zA-Z0-9_]*)\b/g, (match, className) => {
                if (allClassMap[className]) {
                    return `<a class="type-link" onclick="openClass('${allClassMap[className]}', '${className}')">${className}</a>`;
                }
                return className;
            });
        }
        
        function openClass(pkg, className) {
            const arr = apiData[pkg];
            if (arr) {
                const cls = arr.find(c => c.class === className);
                if (cls) {

                   document.getElementById('content').scrollTop = 0;
                }
            }
        }

            else if (upName.includes("ITEM") || upName.includes("INVENTORY") || upName.includes("LOOT")) ideaText = loc.ideaItem;
            else if (upName.includes("MAP") || upName.includes("SQUARE") || upName.includes("CELL") || upName.includes("TILE")) ideaText = loc.ideaMap;

                html += `<p><span class="keyword">${loc.extendsLabel}</span> ${cls.extends.map(e => linkifyType(e)).join(', ')}</p>`;
            }
            
            if (cls.implements && cls.implements.length > 0 && cls.implements[0] !== "") {

        async function checkRateLimitAndGetIP() {
            let history = JSON.parse(localStorage.getItem('api_report_history') || '[]');
            const now = Date.now();
            history = history.filter(time => now - time < 86400000); // 24 hours
            if (history.length >= 5) return { ok: false, msg: i18n[currentLang].dailyLimit };
            
            const lastMinute = history.filter(time => now - time < 60000);
            if (lastMinute.length >= 5) return { ok: false, msg: i18n[currentLang].minuteLimit };
            
            let userIP = "Unknown";
            try {
                const ipRes = await fetch('https://api.ipify.org?format=json');
                if (ipRes.ok) {
                    const ipData = await ipRes.json();
                    userIP = ipData.ip;
                }
            } catch(e) {}
            return { ok: true, ip: userIP };
        }

            let history = JSON.parse(localStorage.getItem('api_report_history') || '[]');

            history = history.filter(time => now - time < 86400000);
            history.push(now);
            localStorage.setItem('api_report_history', JSON.stringify(history));
        }

                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify(dbPayload)
                });

                // Trigger Make.com Webhook with the payload
                fetch('https://hook.us2.make.com/xues0f2xu326atn86rksa6f8a100vk4v', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(makePayload)
                }).catch(e => console.error("Webhook error:", e));

                if (response.ok) {
                    msgObj.innerText = i18n[currentLang].updateSuccess;
                    msgObj.style.color = '#1dd1a1';
                    document.getElementById('updateComment').value = "";
                    saveRateLimit();
                } else {
                    msgObj.innerText = i18n[currentLang].updateError + response.statusText;
                    msgObj.style.color = '#ff6b6b';
                }
            } catch(e) {
                console.error(e);
                msgObj.innerText = i18n[currentLang].updateError + e.message;
                msgObj.style.color = '#ff6b6b';
            }
        }

        searchInput.addEventListener('input', (e) => renderSidebar(e.target.value));
        renderSidebar();
        fetchUpdateCount();

        function updateCooldownUI() {
            let history = JSON.parse(localStorage.getItem('api_report_history') || '[]');
            const now = Date.now();
            let disabled = false;
            let text = "";

            history = history.filter(time => now - time < 86400000);
            if (history.length >= 5) {
                disabled = true;
                text = "Max 5/day";
            } else if (history.length > 0) {
                const last = history[history.length - 1];
                if (now - last < 60000) {
                    disabled = true;
                    const wait = Math.ceil((60000 - (now - last)) / 1000);
                    text = wait + "s";
                }
            }

            const gBtn = document.getElementById('globalHelpBtn');
            if (gBtn) {
                gBtn.disabled = disabled;
                gBtn.style.opacity = disabled ? '0.5' : '1';
                gBtn.style.cursor = disabled ? 'not-allowed' : 'pointer';
                const baseText = i18n[currentLang].globalHelpBtn;
                document.getElementById('globalHelpText').innerText = disabled ? (baseText + " (" + text + ")") : baseText;
            }

            const cBtn = document.getElementById('classUpdateBtn');
            if (cBtn) {
                cBtn.disabled = disabled;
                cBtn.style.opacity = disabled ? '0.5' : '1';
                cBtn.style.cursor = disabled ? 'not-allowed' : 'pointer';
                cBtn.innerText = disabled ? text : i18n[currentLang].updateBtn;
            }
        }

        setInterval(updateCooldownUI, 1000);
        updateCooldownUI();
    </script>
</body>
</html>
